# Copy this file outside the application repository, for example:
#   /root/project-configs/digitalphy.conf
# Protect it with: chmod 600 /root/project-configs/digitalphy.conf

PROJECT_NAME="digitalphy"
REPO_URL="git@github.com:YOUR_ACCOUNT/YOUR_REPOSITORY.git"
GIT_BRANCH="main"

# public: public HTTPS repository, no credentials
# ssh: private repository using one read-only GitHub deploy key per repository (recommended)
# token: private HTTPS repository using GITHUB_TOKEN_FILE
# GitHub account passwords are not supported; never put a token in this file or REPO_URL.
GIT_AUTH_MODE="ssh"

# SSH mode: leave empty to generate /home/anand/.ssh/github_PROJECT_NAME on first run.
GIT_SSH_KEY=""

# Token mode only. Store only a path here—never the token itself.
GIT_USERNAME="x-access-token"
GITHUB_TOKEN_FILE="/root/project-secrets/github-token"

NEW_USER="anand"
SITE_DIR="/srv/sites/digitalphy"
COMPOSE_FILE="docker-compose.yml"
SITE_PORT="8081"

DOMAIN="digitalphymedia.com"
INCLUDE_WWW="yes"
ENABLE_SSL="yes"
SSL_EMAIL="YOUR_EMAIL"

# Root-protected file containing POSTGRES_PASSWORD, ADMIN_SESSION_SECRET,
# Cloudinary credentials, and the other application values.
APP_ENV_SOURCE="/root/project-secrets/digitalphy.env"
